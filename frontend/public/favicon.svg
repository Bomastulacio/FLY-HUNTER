<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtro para el resplandor de neón -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Fondo oscuro estilo App Icon / Favicon -->
  <rect width="512" height="512" rx="115" fill="#09090b"/>
  
  <!-- Capa 1: Resplandor verde (Glow) -->
  <g stroke="#9fdb16" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)">
    <!-- Arco superior izquierdo -->
    <path d="M 285 85 A 175 175 0 0 0 130 340" stroke-width="12"/>
    
    <!-- Arco inferior derecho -->
    <path d="M 230 435 A 175 175 0 0 0 455 250" stroke-width="12"/>
    
    <!-- Estela (Swoosh inferior) -->
    <path d="M 215 315 Q 120 370 75 405" stroke-width="10"/>

    <!-- Avión central -->
    <g transform="translate(290, 240) rotate(50)">
      <path d="M 0,-75 
               C 12,-75 16,-60 16,-45 
               L 16,0 
               L 85,35 
               L 85,50 
               L 16,35 
               L 16,75 
               L 45,95 
               L 45,105 
               L 0,95 
               L -45,105 
               L -45,95 
               L -16,75 
               L -16,35 
               L -85,50 
               L -85,35 
               L -16,0 
               L -16,-45 
               C -16,-60 -12,-75 0,-75 Z" 
            stroke-width="12" />
    </g>
  </g>
  
  <!-- Capa 2: Núcleo brillante y definido -->
  <g stroke="#d5ff6b" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 285 85 A 175 175 0 0 0 130 340" stroke-width="7"/>
    <path d="M 230 435 A 175 175 0 0 0 455 250" stroke-width="7"/>
    <path d="M 215 315 Q 120 370 75 405" stroke-width="5"/>
    <g transform="translate(290, 240) rotate(50)">
      <path d="M 0,-75 
               C 12,-75 16,-60 16,-45 
               L 16,0 
               L 85,35 
               L 85,50 
               L 16,35 
               L 16,75 
               L 45,95 
               L 45,105 
               L 0,95 
               L -45,105 
               L -45,95 
               L -16,75 
               L -16,35 
               L -85,50 
               L -85,35 
               L -16,0 
               L -16,-45 
               C -16,-60 -12,-75 0,-75 Z" 
            stroke-width="7" />
    </g>
  </g>
</svg>
