name: flight-hunter-pipeline

on:
  workflow_run:
    workflows: ["flight-hunter-agent"]
    types:
      - completed
  repository_dispatch:
    types: [resume-after-approval]
  workflow_dispatch: {}

concurrency:
  group: flight-hunter-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore quota ledger and quote cache
        uses: actions/cache@v4
        with:
          path: backend/.cache_vuelos
          key: flight-quota-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flight-quota-v2-

      - name: Download the scraper plan
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: search-plan
          path: run-plan
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          
      - name: Run Critic Evals
        run: |
          python -B evals/test_critic_decisions.py
          python -B evals/test_search_orchestration.py

      - name: Run LangGraph pipeline
        run: |
          cd backend
          python -m src.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FLIGHT_SEARCH_PLAN_PATH: ${{ github.event_name == 'workflow_run' && '../run-plan/search-plan.json' || '' }}
          SERPAPI_ENABLED: ${{ github.event_name != 'repository_dispatch' && 'true' || 'false' }}
          SERPAPI_MAX_PER_RUN: '2'
          SERPAPI_MAX_PER_DAY: '4'
          SERPAPI_MAX_PER_CYCLE: '220'
