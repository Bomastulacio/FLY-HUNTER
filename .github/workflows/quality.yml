name: Offline quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          npm ci --prefix agent
          npm ci --prefix frontend
          pip install -r backend/requirements.txt
      - name: Install Chromium for offline DOM fixtures
        working-directory: agent
        run: npx playwright install chromium --with-deps
      - name: TypeScript, contracts and SQL/RLS
        run: |
          npm run check --prefix agent
          npm test --prefix agent
      - name: Build the web app
        run: npm run build --prefix frontend
      - name: Python policy and orchestration evals
        run: |
          python -B evals/test_critic_decisions.py
          python -B evals/test_search_orchestration.py
          python -B evals/test_radar_notifications.py
          python -B evals/test_radar_contract.py
