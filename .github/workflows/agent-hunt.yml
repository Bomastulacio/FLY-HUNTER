name: flight-hunter-agent

on:
  schedule:
    # Corre dos veces al día: a las 09:00 y a las 21:00 UTC (ajustable)
    - cron: '0 9,21 * * *'
  workflow_dispatch: {} # Permite ejecutar manualmente con un clic desde GitHub Actions

concurrency:
  group: flight-hunter-scrapers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        run: |
          cd agent
          npm ci

      - name: Install Playwright Chromium with Linux dependencies
        run: |
          cd agent
          npx playwright install chromium --with-deps

      - name: Restore search coverage and provider cooldowns
        id: search-state
        uses: actions/cache/restore@v4
        with:
          path: agent/.flight-state
          key: flight-search-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: flight-search-v2-

      - name: Offline collector evals
        run: |
          cd agent
          npm test

      - name: Run Flight Hunter Agent in loop
        run: |
          cd agent
          npx tsx src/index.ts --headless
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL }}
          HEADLESS: "true"

      - name: Preserve consumed searches even after a failed run
        if: always() && steps.search-state.outputs.cache-primary-key != '' && hashFiles('agent/.flight-state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: agent/.flight-state
          key: ${{ steps.search-state.outputs.cache-primary-key }}

      - name: Share the exact plan with LangGraph
        uses: actions/upload-artifact@v7
        with:
          name: search-plan
          path: agent/search-plan.json
          retention-days: 1
          if-no-files-found: error
