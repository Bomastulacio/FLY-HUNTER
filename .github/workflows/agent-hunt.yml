name: flight-hunter-agent

on:
  schedule:
    # Corre dos veces al día: a las 09:00 y a las 21:00 UTC (ajustable)
    - cron: '0 9,21 * * *'
  workflow_dispatch: {} # Permite ejecutar manualmente con un clic desde GitHub Actions

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        run: |
          cd agent
          npm ci

      - name: Install Playwright Chromium with Linux dependencies
        run: |
          cd agent
          npx playwright install chromium --with-deps

      - name: Run Flight Hunter Agent in loop
        run: |
          cd agent
          npx tsx src/index.ts --headless
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HEADLESS: "true"
