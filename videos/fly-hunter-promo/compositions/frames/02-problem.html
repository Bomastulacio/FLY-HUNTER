    <div id="fproblem-code-1" class="code-line">{ "flight": "MAD-BUE", "price": 1200, "stops": 3 }</div>
    <div id="fproblem-code-2" class="code-line">{ "flight": "JFK-LHR", "price": 950, "stops": 2 }</div>

    <div id="fproblem-shredder"></div>

    </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    
    // Shredder enters
    tl.fromTo("#fproblem-shredder",
      { opacity: 0, scaleX: 0 },
      { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
      0
    );

    // Code lines falling
    for (let i = 1; i <= 5; i++) {
      tl.fromTo(`#fproblem-code-${i}`,
        { yPercent: -1000, opacity: 0 },
        { yPercent: 400, opacity: 0.8, duration: 2, ease: "linear" },
        i * 0.4
      );
      
      // Turn red when hitting shredder
      tl.add(() => {
        const el = document.getElementById(`02-problem-code-${i}`);
        if(el) el.classList.add("red-trash");
      }, (i * 0.4) + 1.2);
    }

    window.__timelines["02-problem"] = tl;
